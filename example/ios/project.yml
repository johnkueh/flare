# The iOS grocery list. `xcodegen` writes Groceries.xcodeproj from this file
# (the project isn't checked in), then xcodebuild or Xcode builds it.
name: Groceries
options:
  bundleIdPrefix: com.johnkueh.flare
  deploymentTarget:
    iOS: "17.0"
packages:
  Flare:
    path: ../..
targets:
  Groceries:
    type: application
    platform: iOS
    sources: [Groceries]
    dependencies:
      - package: Flare
        product: SyncKit
      - package: Flare
        product: SyncClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnkueh.flare.groceries
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Groceries
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Groceries/Info.plist
      properties:
        CFBundleDisplayName: Groceries
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The local Worker (`pnpm dev`) is plain http on localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
