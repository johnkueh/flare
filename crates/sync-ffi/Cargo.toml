[package]
name = "sync-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "UniFFI bindings over sync-core and flare-flags for the Swift and Kotlin apps"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "sync_ffi"

[dependencies]
uniffi = "0.32"
sync-core = { workspace = true }
flare-flags = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# Builds the `uniffi-bindgen` binary (host only).
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
